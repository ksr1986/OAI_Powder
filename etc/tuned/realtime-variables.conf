# isolated_cores: cores to isolate for OAI real-time processing
# Reserve cores 13-15 for housekeeping (kernel/kthreads), isolate 0-12 for OAI+PTP
#
# Examples:
#   isolated_cores=2,4-7
#   isolated_cores=2-23
#
isolated_cores=0-12

# Move kernel managed IRQs out of isolated cores (requires kernel support)
isolate_managed_irq=Y

# Number of housekeeping (non-isolated) CPUs for network device queue count
# netdev_queue_count=4
